name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: |
          uv pip install ruff
          ruff check scripts/ dashboard/ tests/

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=scripts

      - name: Verify notebooks (check parseable)
        run: |
          uv run python -m nbformat --version
          for f in notebooks/*.ipynb; do
            uv run python -c "import nbformat; nbformat.read('$f', as_version=4)"
            echo "OK: $f"
          done
