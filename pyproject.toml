[project]
name = "datascope"
version = "3.0.0"
description = "DataScope — Multi-Source Salary Analytics: LinkedIn, Kaggle, Spain (Manfred 2026, Glassdoor), DuckDB, PPP-adjusted"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "scrapling>=0.4",
    "kagglehub>=0.3",
    "streamlit>=1.28",
    "plotly>=5.15",
    "pycountry>=22.3",
    "openpyxl>=3.1",
    "nbformat>=5.9",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "requests>=2.34.2",
    "duckdb>=1.0",
    "tabulate>=0.9",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project.urls]
Repository = "https://github.com/juandelaf1/DataScope"

[tool.pytest.ini_options]
testpaths = ["tests"]
